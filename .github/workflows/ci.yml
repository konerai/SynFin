name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build
      - name: Test
        run: python3 tests/test_sessions.py build/synfin

  windows-exe:
    name: Windows exes (llvm-mingw cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLVM_MINGW: llvm-mingw-20261006-msvcrt-ubuntu-22.04-x86_64
      LLVM_MINGW_SHA256: 9dd3bbff7f746937c99b38322c8b1fcab8054b7d8d31ec840b3457234dff7e52
    steps:
      - uses: actions/checkout@v4
      - name: Install llvm-mingw
        # A pinned, checksummed release from GitHub instead of apt: Ubuntu package
        # mirrors have stalled this job for minutes more than once.
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
               "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-llvm-mingw-x86_64.cmake \
                -DSYNFIN_STATIC=ON -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-win
      - uses: actions/upload-artifact@v4
        with:
          name: synfin-windows-x64
          path: |
            build-win/synfin.exe
            build-win/synfin-gui.exe

  windows-test:
    name: Windows exes on Windows
    needs: windows-exe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synfin-windows-x64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the command-line exe
        run: |
          .\synfin.exe --version
          python tests/test_sessions.py synfin.exe
      - name: Test the GUI
        run: python tests/test_gui_export.py synfin.exe synfin-gui.exe
      - name: Screenshots of the GUI
        run: |
          $dir = "$env:USERPROFILE\Documents\captures"
          New-Item -ItemType Directory -Force $dir | Out-Null
          python docs/make_demo_captures.py "$dir\office_traffic.pcap"
          python docs/make_demo_captures.py "$dir\vpn_gateway.pcap"
          $files = "`"$dir\office_traffic.pcap`" `"$dir\vpn_gateway.pcap`""
          Start-Process -Wait .\synfin-gui.exe "--size 1360x840 --capture windows-results.bmp $files"
          Start-Process -Wait .\synfin-gui.exe "--size 1360x840 --capture windows-timeout.bmp --status-filter timeout $files"
          Start-Process -Wait .\synfin-gui.exe "--size 1360x840 --capture windows-sorted.bmp --sort-duration $files"
          Get-ChildItem *.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: "*.bmp"

  msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          cmake -B build -DSYNFIN_STATIC=ON
          cmake --build build --config Release
      - name: Test
        run: |
          python tests/test_sessions.py build/Release/synfin.exe
          python tests/test_gui_export.py build/Release/synfin.exe build/Release/synfin-gui.exe

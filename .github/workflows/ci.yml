name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build
      - name: Test
        run: python3 tests/test_sessions.py build/synfin

  windows-exe:
    name: Windows exes (MinGW cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        # Time out and retry instead of hanging when a package mirror stalls.
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends g++-mingw-w64-x86-64-posix
      - name: Build
        run: |
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64-x86_64.cmake \
                -DSYNFIN_STATIC=ON -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-win
      - uses: actions/upload-artifact@v4
        with:
          name: synfin-windows-x64
          path: |
            build-win/synfin.exe
            build-win/synfin-gui.exe

  windows-test:
    name: Windows exes on Windows
    needs: windows-exe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synfin-windows-x64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the command-line exe
        run: |
          .\synfin.exe --version
          python tests/test_sessions.py synfin.exe
      - name: Test the GUI
        run: python tests/test_gui_export.py synfin.exe synfin-gui.exe
      - name: Screenshots of the GUI
        run: |
          python docs/make_demo_captures.py office_traffic.pcap
          python docs/make_demo_captures.py vpn_gateway.pcap
          $files = "office_traffic.pcap vpn_gateway.pcap"
          Start-Process -Wait .\synfin-gui.exe "--size 1360x840 --capture windows-results.bmp $files"
          Start-Process -Wait .\synfin-gui.exe "--size 1360x840 --capture windows-timeout.bmp --status-filter timeout $files"
          Start-Process -Wait .\synfin-gui.exe "--size 1360x840 --capture windows-sorted.bmp --sort-duration $files"
          Get-ChildItem *.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: "*.bmp"

  msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          cmake -B build -DSYNFIN_STATIC=ON
          cmake --build build --config Release
      - name: Test
        run: |
          python tests/test_sessions.py build/Release/synfin.exe
          python tests/test_gui_export.py build/Release/synfin.exe build/Release/synfin-gui.exe
